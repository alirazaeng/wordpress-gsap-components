name: Bug report
description: Report a reproducible problem with a GSAP component or WordPress integration.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please provide a minimal, reproducible case and avoid sharing private client data.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Reveal on scroll
        - Stagger grid
        - Magnetic button
        - Text reveal
        - Scroll progress
        - Pinned section
        - Horizontal scroll
        - WordPress integration
        - Build / tooling
        - Other
    validations:
      required: true
  - type: input
    id: wordpress
    attributes:
      label: WordPress version
      placeholder: "e.g. 6.x"
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Chrome 154"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest markup/configuration that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: reduced_motion
    attributes:
      label: Does the problem change with reduced-motion enabled?
      options:
        - Not tested
        - No
        - Yes
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Remove secrets, tokens, client information, and personal data before posting.
